# Publish the crate to crates.io.
#
# Two ways to authenticate, pick one:
#
# 1. Trusted Publishing (recommended, no token needed):
#    - crates.io -> Account settings -> Trusted Publishing -> Add a trusted
#      publisher with: owner = luckie2076, repository = skills-sh,
#      workflow = publish.yml (must match THIS file name).
#    - The `id-token: write` permission below lets `cargo publish` obtain a
#      short-lived token via GitHub OIDC automatically.
#
# 2. API token fallback:
#    - Create a crates.io API token and store it as a GitHub Actions secret
#      named `CARGO_REGISTRY_TOKEN`, then uncomment the `env:` block below
#      and remove `id-token: write` from `permissions`.
#
# Triggers:
# - Push a `v*` tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`), and
#   make sure Cargo.toml's `version` matches the tag.
# - `workflow_dispatch` allows manual publishing from the Actions tab.

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only needed for Trusted Publishing (option 1 above)

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$expected" = "$actual" \
            || { echo "tag v$actual expected, got v$expected" >&2; exit 1; }

      - name: Run tests
        run: cargo test --all-targets

      - name: Publish to crates.io
        run: cargo publish
        # Uncomment for API token fallback (option 2 above):
        # env:
        #   CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
