# Publish the crate to crates.io using an API token.
#
# Setup (one-time):
# 1. Create a crates.io API token (crates.io -> Account settings -> API tokens)
#    with "publish-new / publish-update" permission.
# 2. Store it as a GitHub Actions secret named `CARGO_REGISTRY_TOKEN`
#    (GitHub -> Settings -> Secrets and variables -> Actions -> New secret).
#
# Triggers:
# - Push a `v*` tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`), and
#   make sure Cargo.toml's `version` matches the tag.
# - `workflow_dispatch` allows manual publishing from the Actions tab.

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$expected" = "$actual" \
            || { echo "tag v$actual expected, got v$expected" >&2; exit 1; }

      - name: Run tests
        run: cargo test --all-targets

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
