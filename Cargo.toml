[package]
name = "skills-sh"
version = "0.1.0"
edition = "2024"
description = "A minimal Rust client for scraping the skills.sh skill registry"
license = "MIT"

[dependencies]
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6.5"
